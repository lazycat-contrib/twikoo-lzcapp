application:
  subdomain: twikoo
  multi_instance: false
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://twikoo:8080/
services:
  twikoo:
    # upstream: imaegoo/twikoo:2.0.17
    image: docker.1ms.run/imaegoo/twikoo:2.0.17
    environment:
      - TWIKOO_DATA=/app/data
      - TWIKOO_THUMBUP=true
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/data:/app/data
usage: |
  Twikoo 是轻量评论系统：给静态博客加评论区，后台可以审核、删除和配置通知。

  使用方法：
  1. 打开应用会看到「Twikoo 云函数运行正常」的提示页，说明服务已就绪。
  2. 在博客页面引入 Twikoo 前端脚本，把 envId 填成本应用的访问地址。
  3. 首次进评论区时会引导你设置管理员密码，设置完即可在后台管理评论。

  数据与安全：
  - 评论、配置和附件保存在 /lzcapp/var/data，卸载应用会一并删除，请定期备份。
  - 管理员密码在首次使用时由你本人设置，本包不预置任何账号或默认口令。
  - 应用经懒猫入口鉴权访问。

  说明：
  - Twikoo 本身是给其它页面调用的评论后端，直接打开只显示状态页，这是正常现象。
  - 博客页面需要能从公网访问本应用地址，否则评论区加载不出来。
  - 未做真机验证：管理员密码设置、评论提交与审核、邮件通知以及重启后持久化均未在设备上实测。
